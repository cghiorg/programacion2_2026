<!DOCTYPE html>
<html>
    <head>
        <title>Mi página Web</title>
    </head>
    <body>

<style>
body {
    font-family: Arial;
}

input {
    padding: 10px;
    margin: 5px;
}

button {
    background-color: rgb(6, 104, 250);
    color: white;
    padding: 40px;
}
</style>

    <form action="/enviar" method="POST">

        <button type="submit">Enviar</button>

    </form>

{% extends "base.html" %}

{% block contenido %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        {% if producto %}
            <h3>Editar producto</h3>
        {% else %}
            <h3>Nuevo producto</h3>
        {% endif %}

    </div>

    <div class="card-body">

        <form method="POST">

            <!-- NOMBRE -->

            <div class="mb-3">

                <label class="form-label">
                    Nombre del producto
                </label>

                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    value="{{ producto.nombre if producto else '' }}"
                    required>

            </div>

            <!-- DESCRIPCIÓN -->

            <div class="mb-3">

                <label class="form-label">
                    Descripción
                </label>

                <textarea
                    name="descripcion"
                    class="form-control"
                    rows="3">{{ producto.descripcion if producto else '' }}</textarea>

            </div>

            <!-- PRECIO -->

            <div class="mb-3">

                <label class="form-label">
                    Precio
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="precio"
                    class="form-control"
                    value="{{ producto.precio if producto else '' }}"
                    required>

            </div>

            <!-- STOCK -->

            <div class="mb-3">

                <label class="form-label">
                    Stock
                </label>

                <input
                    type="number"
                    name="stock"
                    class="form-control"
                    value="{{ producto.stock if producto else '' }}"
                    required>

            </div>

            <!-- BOTONES -->

            <button type="submit" class="btn btn-success">
                Guardar producto
            </button>

            <a href="{{ url_for('listar_productos') }}"
               class="btn btn-secondary">

               Volver

            </a>

        </form>

    </div>

</div>

{% endblock %}

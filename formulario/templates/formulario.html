{% extends "base.html" %}

{% block contenido %}

<div class="card shadow">
    <div class="card-header">
        {% if producto %}
            <h3>Editar producto</h3>
        {% else %}
            <h3>Nuevo producto</h3>
        {% endif %}
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input 
                    type="text" 
                    name="nombre" 
                    class="form-control"
                    value="{{ producto.nombre if producto else '' }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <input 
                    type="text" 
                    name="descripcion" 
                    class="form-control"
                    value="{{ producto.descripcion if producto else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input 
                    type="number" 
                    step="0.01" 
                    name="precio" 
                    class="form-control"
                    value="{{ producto.precio if producto else '' }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Stock</label>
                <input 
                    type="number" 
                    name="stock" 
                    class="form-control"
                    value="{{ producto.stock if producto else '' }}"
                    required>
            </div>

            <button type="submit" class="btn btn-primary">
                Guardar
            </button>

            <a href="{{ url_for('listar_productos') }}" class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>
</div>

{% endblock %}
